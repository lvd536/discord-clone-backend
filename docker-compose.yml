services:
    db:
        container_name: postgres_discord_db
        image: postgres:15.2
        restart: always
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
        ports:
            - '1337:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - backend

    # db-interface:
    #     image: dpage/pgadmin4:latest
    #     container_name: pgadmin
    #     restart: always
    #     environment:
    #         - PGADMIN_DEFAULT_EMAIL=admin@admin.com
    #         - PGADMIN_DEFAULT_PASSWORD=admin
    #     ports:
    #         - '5050:80'
    #     networks:
    #         - backend
    #     depends_on:
    #         - db

    redis:
        container_name: redis_auth_db
        image: redis:7.2-alpine
        restart: always
        ports:
            - '6380:6379'
        command: redis-server --requirepass ${REDIS_PASSWORD}
        volumes:
            - redis_data:/data
        networks:
            - backend

    # redis-insight:
    #     image: redis/redisinsight:latest
    #     container_name: redis_insight
    #     restart: always
    #     ports:
    #         - '5540:5540'
    #     volumes:
    #         - redis_insight_data:/data
    #     networks:
    #         - backend
    #     depends_on:
    #         - redis

    livekit:
        container_name: livekit_server
        image: livekit/livekit-server:latest
        restart: always
        ports:
            - '7880:7880'
            - '7881:7881'
            - '7882:7882/udp'
        environment:
            - LIVEKIT_KEYS=${LIVEKIT_API_URI}
        volumes:
            - ./livekit.yaml:/livekit.yaml
        command: --config /livekit.yaml
        networks:
            - backend
volumes:
    postgres_data:
    redis_data:
    # redis_insight_data:

networks:
    backend:
